<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>羽球排場小幫手</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#5a4a42;--muted:#9a8c84;--a:#5f8f82;--a-bg:#eef5f2;--b:#c9786a;--b-bg:#fbeeea;--line:#ded6cc;--cnt:#e3eaf1;--cnt-ink:#41556b;--btn:#a98574;--btn-ink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1917;--card:#2a2522;--ink:#eadfd8;--muted:#a99c93;--a:#7fb3a5;--a-bg:#20322d;--b:#e0907f;--b-bg:#3a2622;--line:#453d38;--cnt:#34404d;--cnt-ink:#bcd0e6;--btn:#8d6a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1917;--card:#2a2522;--ink:#eadfd8;--muted:#a99c93;--a:#7fb3a5;--a-bg:#20322d;--b:#e0907f;--b-bg:#3a2622;--line:#453d38;--cnt:#34404d;--cnt-ink:#bcd0e6;--btn:#8d6a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:1.5rem;margin:6px 0 14px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:.9rem}
.fill{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:20px}
.card h2{text-align:center;font-size:1.1rem;margin:0 0 14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.lab{text-align:center;font-weight:700;font-size:.9rem;margin-bottom:6px}
.lab.a{color:var(--a)}.lab.b{color:var(--b)}
.box{min-height:78px;border:2px solid;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center}
.box.a{border-color:var(--a);background:var(--a-bg)}
.box.b{border-color:var(--b);background:var(--b-bg)}
.vsmark{font-weight:800;color:var(--muted);padding-top:22px}
.st{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.st b{font-size:1.8rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.st button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.wins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.win{border:0;border-radius:10px;padding:12px;font-weight:700;color:#fff}
.win.a{background:var(--a)}.win.b{background:var(--b)}
.win:disabled{opacity:.45;cursor:not-allowed}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin:0 0 8px}
.sec small{font-weight:400;color:var(--muted)}
.pool{min-height:70px;border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700}
.chip i{font-style:normal;font-weight:400;font-size:.75rem;color:var(--muted)}
.chip em{font-style:normal;font-size:.75rem;background:var(--cnt);color:var(--cnt-ink);border-radius:999px;padding:0 8px}
.edit .chip{border-color:var(--b)}
.empty{color:var(--muted);margin:auto;font-size:.9rem}
.add{display:flex;gap:8px}
.add input{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.add button{border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);padding:0 20px;font-weight:700}
.tools{display:flex;gap:14px;justify-content:flex-end;margin-top:10px}
.tools button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:2px}
.log{margin-top:18px;color:var(--muted);font-size:.85rem}
.log div{padding:3px 0;border-bottom:1px solid var(--line)}
.pts{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);margin-top:10px;min-height:124px;width:100%}
.pts b{font-size:3.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.pts small{color:var(--muted)}
.pts.a{border-color:var(--a)}
.pts.b{border-color:var(--b)}
.pts:active{background:var(--bg)}
.pts:disabled{opacity:.6;cursor:default}
.gh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.gh button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;margin-left:6px;font-size:.8rem}
.banner{margin-top:10px;background:var(--a);color:#fff;text-align:center;border-radius:8px;padding:6px;font-weight:700}
.win.hl{outline:3px solid var(--btn);outline-offset:2px}
.chip em.rs{background:var(--b-bg);color:var(--b)}
.top{flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<h1>羽球排場小幫手</h1>
<div class="top"><span>💡 點擊名牌即可迅速加入或移出隊伍</span><span class="btns"><button class="fill" id="mix">🎲 隨機分隊</button><button class="fill" id="fill">🔥 一鍵填補最少場次者</button></span></div>
<div id="app"></div>
<div class="add"><input id="nm" placeholder="新增球員：名字-級數 (例: 小王-3)" aria-label="新增球員"><button id="add">新增</button></div>
<div class="tools"><button id="edit">編輯名單</button><button id="clear">清空全部</button></div>
<div class="log" id="log"></div>
</main>
<script>
const KEY="badminton-v2";
let S={players:[],a:[],b:[],q:[],cur:[0,0],games:[],hist:[],no:1,log:[]},editing=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=n=>S.players.find(p=>p.n===n);
const inUse=n=>S.a.includes(n)||S.b.includes(n)||S.q.includes(n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(KEY);if(v){const o=JSON.parse(v);if(o&&Array.isArray(o.players))S=Object.assign(S,o)}}catch(e){}}
function place(n){if(S.a.length<2)S.a.push(n);else if(S.b.length<2)S.b.push(n);else if(S.q.length<4)S.q.push(n);else return false;return true}
function toggle(n){
  for(const k of ["a","b","q"]){const i=S[k].indexOf(n);if(i>-1){S[k].splice(i,1);return}}
  if(!place(n))alert("場上與預備佇列都滿了");
}
function fill(){
  const need=(2-S.a.length)+(2-S.b.length)+(4-S.q.length);
  shuffle(S.players.filter(p=>!inUse(p.n))).sort((x,y)=>((y.r||0)-(x.r||0))||(x.g-y.g)).slice(0,need).forEach(p=>place(p.n));
  mix();
  save();render();
}
function win(side){
  if(S.a.length<2||S.b.length<2){alert("A、B 隊各需要 2 人");return}
  const w=S[side];
  S.players.forEach(p=>{if(S.a.includes(p.n)||S.b.includes(p.n)){p.g++;p.r=0}else p.r=(p.r||0)+1});
  S.log.unshift(`第 ${S.no} 場　${side==="a"?"A":"B"} 隊獲勝（${w.join("、")}）　${scoreText()}`);
  S.log=S.log.slice(0,8);
  const nq=shuffle(S.q);S.a=nq.slice(0,2);S.b=nq.slice(2,4);S.q=[];S.cur=[0,0];S.games=[];S.hist=[];S.no++;
  save();render();
}
function mix(){
  const fresh=!S.games.length&&!S.cur[0]&&!S.cur[1];
  if(fresh&&S.a.length+S.b.length===4){const c=shuffle(S.a.concat(S.b));S.a=c.slice(0,2);S.b=c.slice(2)}
  S.q=shuffle(S.q);
}
function randomTeams(){
  if(S.games.length||S.cur[0]||S.cur[1]){alert("比賽已經開始計分，無法重新分隊。要重新分隊請先按「重設比分」。");return}
  if(S.a.length+S.b.length<4&&S.q.length<4){alert("場上或佇列滿 4 人才能隨機分隊");return}
  mix();save();render();
}
function gameOver(c){const m=Math.max(c[0],c[1]);return (m>=21&&Math.abs(c[0]-c[1])>=2)||m===30}
const gw=s=>S.games.filter(g=>g[s]>g[1-s]).length;
const isDone=()=>gw(0)===2||gw(1)===2;
function scoreText(){const g=S.games.slice();if(S.cur[0]||S.cur[1])g.push(S.cur);return g.map(x=>x[0]+":"+x[1]).join("、")||"0:0"}
function point(s){
  if(isDone())return;
  S.hist.push(JSON.stringify({games:S.games,cur:S.cur}));
  S.cur=S.cur.slice();S.cur[s]++;
  if(gameOver(S.cur)){S.games=S.games.concat([S.cur]);S.cur=[0,0]}
  save();render();
}
function undo(){if(!S.hist.length)return;Object.assign(S,JSON.parse(S.hist.pop()));save();render()}
function resetScore(){S.cur=[0,0];S.games=[];S.hist=[];save();render()}
function addPlayers(){
  $("nm").value.split(/[,，、\n]+/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    const m=s.match(/^(.+?)\s*[-－]\s*(\d+)$/),n=(m?m[1]:s).trim(),lv=m?+m[2]:3;
    if(n&&!P(n))S.players.push({n,lv,g:0,r:0});
  });
  $("nm").value="";save();render();
}
const chip=n=>{const p=P(n);return p?`<button class="chip" data-n="${esc(n)}">${esc(n)}<i>Lv.${p.lv}</i><em>${p.g}場</em>${(p.r||0)>0&&!inUse(n)?`<em class="rs">已休${p.r}場</em>`:""}${editing?" ×":""}</button>`:""};
function render(){
  const full=S.a.length===2&&S.b.length===2,done=isDone();
  const pool=S.players.filter(p=>!inUse(p.n));
  $("app").innerHTML=`
  <div class="card"><h2>第 ${S.no} 場次</h2>
    <div class="vs">
      <div><div class="lab a">A 隊 (${S.a.length}人)</div><div class="box a">${S.a.map(chip).join("")}</div></div>
      <div class="vsmark">VS</div>
      <div><div class="lab b">B 隊 (${S.b.length}人)</div><div class="box b">${S.b.map(chip).join("")}</div></div>
    </div>
    <div class="vs"><button class="pts a" data-pt="0" ${done?"disabled":""} aria-label="A 隊加一分"><b>${S.cur[0]}</b><small>已贏 ${gw(0)} 局</small></button><span></span>
    <button class="pts b" data-pt="1" ${done?"disabled":""} aria-label="B 隊加一分"><b>${S.cur[1]}</b><small>已贏 ${gw(1)} 局</small></button></div>
    <div class="gh"><span>${S.games.length?S.games.map((g,i)=>`第${i+1}局 ${g[0]}:${g[1]}`).join("　"):"點上方分數加分｜21 分制・領先 2 分・三戰兩勝"}</span><span><button data-undo="1">退一步</button><button data-rs="1">重設比分</button></span></div>
    ${done?`<div class="banner">${gw(0)>gw(1)?"A":"B"} 隊贏下比賽，請按下方獲勝按鈕換下一場</div>`:""}
    <div class="wins"><button class="win a ${done&&gw(0)>gw(1)?"hl":""}" data-win="a" ${full?"":"disabled"}>🏆 A 隊獲勝</button><button class="win b ${done&&gw(1)>gw(0)?"hl":""}" data-win="b" ${full?"":"disabled"}>🏆 B 隊獲勝</button></div>
  </div>
  <div class="sec"><span>🔮 下一場預備佇列 (${S.q.length}人)</span><small>前 2 人 A 隊，後 2 人 B 隊</small></div>
  <div class="pool">${S.q.length?S.q.map(chip).join(""):`<span class="empty">點擊下方球員加入佇列</span>`}</div>
  <div class="sec"><span>👥 球員準備池 (${editing?"點擊名牌移除":"點擊快速排隊"})</span><small>總人數: ${S.players.length}</small></div>
  <div class="pool ${editing?"edit":""}">${pool.length?pool.map(p=>chip(p.n)).join(""):`<span class="empty">${S.players.length?"所有人都已排進場次":"先在下方新增球員"}</span>`}</div>`;
  $("log").innerHTML=S.log.length?"<b>對戰紀錄</b>"+S.log.map(l=>`<div>${esc(l)}</div>`).join(""):"";
  $("edit").textContent=editing?"完成編輯":"編輯名單";
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.n!==undefined){
    const n=t.dataset.n;
    if(editing&&!inUse(n)){S.players=S.players.filter(p=>p.n!==n)}else toggle(n);
    save();render();
  }else if(t.dataset.win)win(t.dataset.win);
  else if(t.dataset.pt)point(+t.dataset.pt);
  else if(t.dataset.undo)undo();
  else if(t.dataset.rs)resetScore();
});
$("fill").onclick=fill;
$("mix").onclick=randomTeams;
$("add").onclick=addPlayers;
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")addPlayers()});
$("edit").onclick=()=>{editing=!editing;render()};
$("clear").onclick=()=>{if(!confirm("確定要清空所有球員與紀錄？"))return;S={players:[],a:[],b:[],q:[],cur:[0,0],games:[],hist:[],no:1,log:[]};save();render()};
load();render();
</script>
</body>
</html>
